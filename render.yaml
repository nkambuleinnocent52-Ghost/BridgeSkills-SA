services:
  - type: web
    name: skillbridge-sa
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: skillbridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/skillbridge.sqlite
      - key: SEED_DEMO
        value: "true"
